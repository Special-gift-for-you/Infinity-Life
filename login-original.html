<script nonce="UrwUSBsEZixVv9B_4HLMMA">
document.addEventListener('click',spawnParticles);
document.addEventListener('touchstart',e=>{[...e.touches].forEach(t=>spawnParticles({clientX:t.clientX,clientY:t.clientY}))},{passive:true});
function spawnParticles(e){
  for(let i=0;i<8;i++){
    const el=document.createElement('div');
    el.textContent=icons[Math.floor(Math.random()*icons.length)];
    const rad=((360/8)*i+Math.random()*20)*Math.PI/180,d=60+Math.random()*80;
    const dx=Math.cos(rad)*d,dy=Math.sin(rad)*d;
    el.style.cssText=`position:fixed;left:${e.clientX}px;top:${e.clientY}px;font-size:${16+Math.random()*18}px;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:all .8s cubic-bezier(.25,.46,.45,.94);opacity:1;`;
    document.body.appendChild(el);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      el.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(0)`;
      el.style.opacity='0';
    }));
    setTimeout(()=>el.remove(),900);
  }
}
const heartIcons=['🦋','💜'];
const MAX_FLOATS=24;   // حد أقصى للعناصر المتحركة في نفس الوقت
setInterval(()=>{
  if(document.hidden)return;          // التاب في الخلفية
  const box=document.getElementById('floatsContainer');
  if(box&&box.childElementCount>=MAX_FLOATS)return;   // اتكوّموا كفاية
  for(let i=0;i<2;i++){
    const el=document.createElement('div');
    el.className='float-item';
    el.textContent=heartIcons[Math.floor(Math.random()*heartIcons.length)];
    el.style.left=Math.random()*100+'%';
    el.style.fontSize=(Math.random()*14+24)+'px';
    el.style.animationDuration=(Math.random()*5+9)+'s';
    el.style.animationDelay=(Math.random()*.8)+'s';
    el.style.opacity='0';
    document.getElementById('floatsContainer').appendChild(el);
    setTimeout(()=>el.remove(),16000);
  }
},700);
</script>
